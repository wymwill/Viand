name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Several pushes in quick succession used to leave every superseded run going.
# Only the newest commit on a branch is worth verifying; cancelling the rest
# also means a red badge always refers to current main rather than to whichever
# stale run happened to finish last.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # No secrets are configured, so the suite and the build must pass with none.
      - name: Build
        run: npm run build
